name: drezivo

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: drezivo
      POSTGRES_USER: drezivo
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your untracked local environment}"
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drezivo -d drezivo"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  adminer:
    image: adminer:4.8.1-standalone
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - 127.0.0.1:8080:8080

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in your untracked local environment}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in your untracked local environment}"
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-16T15-35-03Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in your untracked local environment}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in your untracked local environment}"
    entrypoint: >
      /bin/sh -ec '
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done;
      mc mb --ignore-existing local/drezivo-private;
      mc anonymous set none local/drezivo-private;
      mc mb --ignore-existing local/drezivo-public;
      mc anonymous set none local/drezivo-public;
      '
    restart: "no"

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: ["http", "http://host.docker.internal:4000"]
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN}"
    ports:
      - "127.0.0.1:4040:4040"

volumes:
  postgres_data:
  minio_data:
