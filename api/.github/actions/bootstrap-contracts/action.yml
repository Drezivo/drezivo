name: Bootstrap shared contracts
description: Build the pinned shared contracts package for local file dependencies
inputs:
  ref:
    description: Full 40 character contracts commit SHA
    required: true
  token:
    description: Read token for the contracts repository
    required: true
runs:
  using: composite
  steps:
    - name: Validate contracts ref
      shell: bash
      env:
        CONTRACTS_REF: ${{ inputs.ref }}
      run: |
        if [[ ! "$CONTRACTS_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "::error::CONTRACTS_REF must be a full 40-character commit SHA"
          exit 1
        fi
    - name: Checkout shared contracts
      uses: actions/checkout@v4
      with:
        repository: Drezivoo/contracts
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        path: .contracts-source
        persist-credentials: false
    - name: Build shared contracts package
      shell: bash
      run: |
        set -euo pipefail
        cd .contracts-source
        npm ci
        npm run build
        mkdir -p "$GITHUB_WORKSPACE/../contracts"
        npm pack --pack-destination "$GITHUB_WORKSPACE/../contracts"
