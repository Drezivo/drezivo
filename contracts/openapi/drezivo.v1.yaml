                        type:
                          - string
                          - "null"
                        minLength: 3
                        maxLength: 100
                        pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$
                      status:
                        type: string
                        enum: *a1
                      selected_plan_code:
                        type:
                          - string
                          - "null"
                        enum: *a2
                      is_trial_eligible:
                        type: boolean
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                    required:
                      - id
                      - clerk_org_id
                      - organization_name
                      - requested_slug
                      - status
                      - selected_plan_code
                      - is_trial_eligible
                      - created_at
                      - updated_at
                  request_id:
                    type: string
                    minLength: 1
                required:
                  - success
                  - data
                  - request_id
        "201":
          description: Clerk organization and local onboarding created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
