          name: Idempotency-Key
          in: header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_id:
                  type: string
                  format: uuid
                amount_minor:
                  type: string
                  pattern: ^-?(0|[1-9]\d*)$
                currency:
                  type: string
                  pattern: ^[A-Z]{3}$
                purpose:
                  type: string
                  enum: &a5
                    - rental_refund
                    - security_deposit_release
                    - goodwill_adjustment
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
              required:
                - payment_id
                - amount_minor
                - currency
                - purpose
                - reason
      responses:
        "201":
          description: Refund instruction recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      refund:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          payment_id:
                            type: string
                            format: uuid
                          amount_minor:
                            type: string
                            pattern: ^-?(0|[1-9]\d*)$
                          currency:
                            type: string
                            pattern: ^[A-Z]{3}$
                          purpose:
                            type: string
                            enum: *a5
                          status:
                            type: string
                            enum:
                              - requested
                              - processing
                              - completed
                              - failed
                              - cancelled
                          merchant_reference:
                            type:
                              - string
                              - "null"
                          completed_at:
                            type:
                              - string
                              - "null"
                            format: date-time
                        required:
                          - id
                          - payment_id
                          - amount_minor
                          - currency
                          - purpose
                          - status
                          - merchant_reference
                          - completed_at
                    required:
                      - refund
                  request_id:
                    type: string
                    minLength: 1
                required:
                  - data
                  - request_id
        "409":
          description: CAPACITY_CONFLICT — requested amount exceeds the remaining
            refundable balance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum: *a1
                  message:
                    type: string
                    minLength: 1
                  request_id:
                    type: string
                    minLength: 1
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          minLength: 1
                        message:
                          type: string
                          minLength: 1
                      required:
                        - field
                        - message
                required:
                  - code
                  - message
                  - request_id
