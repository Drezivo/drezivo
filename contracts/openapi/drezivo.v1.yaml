  /refunds:
    post:
      tags:
        - finance
      summary: Refund instruction; locked residual amount (TRD §4, §6).
      parameters:
        - schema:
            type: string
            minLength: 8
            maxLength: 255
          required: true
          name: Idempotency-Key
          in: header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_id:
                  type: string
                  format: uuid
                amount_minor:
                  type: string
                  pattern: ^-?(0|[1-9]\d*)$
                currency:
                  type: string
                  pattern: ^[A-Z]{3}$
                purpose:
                  type: string
                  enum: &a32
                    - rental_refund
                    - security_deposit_release
                    - goodwill_adjustment
                    - fitting_fee_refund
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
              required:
                - payment_id
                - amount_minor
                - currency
                - purpose
                - reason
      responses:
        "201":
          description: Refund instruction recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      refund:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          payment_id:
                            type: string
                            format: uuid
                          amount_minor:
                            type: string
                            pattern: ^-?(0|[1-9]\d*)$
                          currency:
                            type: string
                            pattern: ^[A-Z]{3}$
                          purpose:
                            type: string
                            enum: *a32
                          status:
                            type: string
                            enum: *a33
                          merchant_reference:
                            type:
                              - string
                              - "null"
                          completed_at:
                            type:
                              - string
                              - "null"
                            format: date-time
                        required:
                          - id
                          - payment_id
                          - amount_minor
                          - currency
                          - purpose
                          - status
                          - merchant_reference
                          - completed_at
                    required:
                      - refund
                  request_id:
                    type: string
                    minLength: 1
                required:
                  - success
                  - data
                  - request_id
        "409":
          description: CAPACITY_CONFLICT — requested amount exceeds the remaining
            refundable balance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum: *a22
                      message:
                        type: string
                        minLength: 1
                      fields:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              minLength: 1
                            message:
                              type: string
                              minLength: 1
                          required:
                            - field
                            - message
                    required:
                      - code
                      - message
                  request_id:
                    type: string
                    minLength: 1
                required:
                  - success
                  - error
                  - request_id
  /uploads:
    post:
      tags:
        - files
      summary: Authorize a direct-to-storage upload (TRD §4, §7).
      parameters:
        - schema:
            type: string
            minLength: 8
            maxLength: 255
          required: true
          name: Idempotency-Key
          in: header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  enum:
                    - catalogue_image
                    - measurement_guide
                    - payment_receipt
                    - verification_document
                    - storefront_asset
                    - export_result
                content_type:
                  type: string
                  enum:
                    - image/jpeg
                    - image/png
                    - image/webp
                    - application/pdf
                byte_size:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 10485760
                sha256:
                  type: string
                  pattern: ^[A-Za-z0-9+/]{43}=$
              required:
                - purpose
                - content_type
                - byte_size
                - sha256
              additionalProperties: false
      responses:
        "201":
          description: Upload authorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      file_id:
                        type: string
                        format: uuid
                      upload_url:
                        type: string
                        format: uri
                      upload_method:
                        type: string
                        enum:
                          - PUT
                      required_headers:
                        type: object
                        additionalProperties:
                          type: string
                      expires_at:
                        type: string
                        format: date-time
                    required:
                      - file_id
                      - upload_url
                      - upload_method
                      - required_headers
                      - expires_at
                  request_id:
                    type: string
                    minLength: 1
                required:
                  - success
                  - data
                  - request_id
        "422":
          description: Validation failed — see catalogue_image, measurement_guide,
            payment_receipt, verification_document, storefront_asset,
            export_result for allowed purposes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum: *a22
                      message:
                        type: string
                        minLength: 1
                      fields:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              minLength: 1
                            message:
                              type: string
                              minLength: 1
                          required:
                            - field
                            - message
                    required:
                      - code
                      - message
                  request_id:
                    type: string
                    minLength: 1
                required:
                  - success
                  - error
                  - request_id
