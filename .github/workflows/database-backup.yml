name: encrypted production database backup

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drezivo-production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: database-backup-production
    steps:
      - name: Check out the default-branch workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install API workspace dependencies
        run: npm ci --workspace @drezivo/api --include-workspace-root

      - name: Install pinned age encryption tool
        shell: bash
        run: |
          set -euo pipefail
          command -v go >/dev/null || { echo '::error::Go is required on the ubuntu-24.04 runner.'; exit 1; }
          export GOBIN="$RUNNER_TEMP/age-bin"
          mkdir -p "$GOBIN"
          go install filippo.io/age/cmd/age@v1.3.2
          echo "$GOBIN" >> "$GITHUB_PATH"
          "$GOBIN/age" --version
          age_test_dir="$(mktemp -d "$RUNNER_TEMP/age-self-test.XXXXXX")"
          trap 'rm -rf -- "$age_test_dir"' EXIT
          "$GOBIN/age-keygen" -o "$age_test_dir/identity"
          "$GOBIN/age-keygen" -y "$age_test_dir/identity" > "$age_test_dir/recipient"
          printf '%s\n' 'Drezivo backup encryption self-test' > "$age_test_dir/plaintext"
          "$GOBIN/age" --recipient "$(tr -d '\r\n' < "$age_test_dir/recipient")" \
            --output "$age_test_dir/encrypted" "$age_test_dir/plaintext"
          "$GOBIN/age" --decrypt --identity "$age_test_dir/identity" \
            --output "$age_test_dir/decrypted" "$age_test_dir/encrypted"
          cmp --silent "$age_test_dir/plaintext" "$age_test_dir/decrypted"
          echo 'age encryption/decryption self-test passed'

      - name: Pull pinned PostgreSQL client image
        run: docker pull postgres:17.11-alpine3.24

      - name: Create, encrypt, verify, and retain snapshots
        run: npm run backup:database --workspace @drezivo/api
        env:
          SUPABASE_BACKUP_DATABASE_URL: ${{ secrets.SUPABASE_BACKUP_DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
