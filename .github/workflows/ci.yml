name: backend

on:
  pull_request:
    paths:
      - "api/**"
      - "contracts/**"
      - ".github/scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  push:
    branches: [main, staging]
    tags: ["v*.*.*"]
    paths:
      - "api/**"
      - "contracts/**"
      - ".github/scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  # A main run may be waiting on or applying a production migration. Let it finish before
  # another main run starts; other refs keep the existing replaceable-CI behavior.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  secrets:
    name: secret-file hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject tracked environment files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)'; then
            echo "::error::A .env file is tracked. Remove it and rotate every value in it."
            exit 1
          fi
      - name: Scan repository for leaked secrets
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --redact --no-banner /repo

  backend:
    name: contracts and API checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_DB: drezivo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d drezivo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/drezivo_test
      TEST_DATABASE_APP_PASSWORD: drezivo_app_ci_test
      TEST_DATABASE_WORKER_PASSWORD: drezivo_worker_ci_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run shared backend validation
        run: npm run validate:backend:ci

  container:
    name: build backend container
    needs: [backend, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build server and worker image
        run: docker build --file api/Dockerfile --tag drezivo-api:${{ github.sha }} .

  migration-scope:
    name: detect main-branch migration run
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Select migration runs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The push event does not include a usable previous commit; refusing to infer migration changes."
            exit 1
          fi
          git cat-file -e "${BEFORE_SHA}^{commit}"

          changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- api/src/db/migrations/)"
          migration_files="$(printf '%s\n' "$changed_files" | grep -E '^api/src/db/migrations/[0-9]{4}_.*\.sql$' || true)"
          if [[ -n "$migration_files" ]]; then
            echo "Migration files changed on main:"
            printf '%s\n' "$migration_files"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  staging-migration-scope:
    name: detect staging migration run
    if: >-
      github.ref == 'refs/heads/staging' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Select migration runs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The push event does not include a usable previous commit; refusing to infer migration changes."
            exit 1
          fi
          git cat-file -e "${BEFORE_SHA}^{commit}"

          changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- api/src/db/migrations/)"
          migration_files="$(printf '%s\n' "$changed_files" | grep -E '^api/src/db/migrations/[0-9]{4}_.*\.sql$' || true)"
          if [[ -n "$migration_files" ]]; then
            echo "Migration files changed on staging:"
            printf '%s\n' "$migration_files"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  staging-migrations:
    name: apply migrations to staging
    if: needs.staging-migration-scope.outputs.run == 'true'
    needs: [backend, container, secrets, staging-migration-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: drezivo-preview-migrations
      cancel-in-progress: false
    env:
      NODE_ENV: staging
      DATABASE_URL_DIRECT: ${{ secrets.MIGRATION_DATABASE_URL_DIRECT }}
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reject a stale staging commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin staging --quiet
          staging_head="$(git rev-parse FETCH_HEAD)"
          if [[ "$staging_head" != "$GITHUB_SHA" ]]; then
            echo "::error::This migration run is stale. The checked-out commit is no longer the staging branch head."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Report staging migration status
        run: npm run db:migrate:status --workspace @drezivo/api
      - name: Reject a stale staging commit before applying
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin staging --quiet
          staging_head="$(git rev-parse FETCH_HEAD)"
          if [[ "$staging_head" != "$GITHUB_SHA" ]]; then
            echo "::error::This migration run became stale before application."
            exit 1
          fi
      - name: Apply staging migrations
        run: npm run db:migrate --workspace @drezivo/api
      - name: Verify staging migration status
        run: npm run db:migrate:status --workspace @drezivo/api

  preview-migrations:
    name: apply migrations to preview
    if: needs.migration-scope.outputs.run == 'true'
    needs: [backend, container, secrets, migration-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    concurrency:
      group: drezivo-preview-migrations
      cancel-in-progress: false
    env:
      NODE_ENV: staging
      DATABASE_URL_DIRECT: ${{ secrets.MIGRATION_DATABASE_URL_DIRECT }}
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reject a stale main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          main_head="$(git rev-parse FETCH_HEAD)"
          if [[ "$main_head" != "$GITHUB_SHA" ]]; then
            echo "::error::This migration run is stale. The checked-out commit is no longer the main branch head."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Report preview migration status
        run: npm run db:migrate:status --workspace @drezivo/api
      - name: Reject a stale main commit before applying
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          main_head="$(git rev-parse FETCH_HEAD)"
          if [[ "$main_head" != "$GITHUB_SHA" ]]; then
            echo "::error::This migration run became stale before application."
            exit 1
          fi
      - name: Apply preview migrations
        run: npm run db:migrate --workspace @drezivo/api
      - name: Verify preview migration status
        run: npm run db:migrate:status --workspace @drezivo/api

  production-migrations:
    name: apply migrations to production
    if: needs.migration-scope.outputs.run == 'true'
    needs: [backend, container, secrets, migration-scope, preview-migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_ENV: production
      DATABASE_URL_DIRECT: ${{ secrets.MIGRATION_DATABASE_URL_DIRECT }}
      MIGRATION_PRODUCTION_RECONCILED: ${{ vars.MIGRATION_PRODUCTION_RECONCILED }}
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reject a stale main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          main_head="$(git rev-parse FETCH_HEAD)"
          if [[ "$main_head" != "$GITHUB_SHA" ]]; then
            echo "::error::This migration run is stale. The checked-out commit is no longer the main branch head."
            exit 1
          fi
      - name: Require production baseline reconciliation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MIGRATION_PRODUCTION_RECONCILED" != "true" ]]; then
            echo "::error::Production migration is blocked until the live schema and Drezivo migration ledger have been reconciled."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Report production migration status
        run: npm run db:migrate:status --workspace @drezivo/api
      - name: Reject a stale main commit before applying
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          main_head="$(git rev-parse FETCH_HEAD)"
          if [[ "$main_head" != "$GITHUB_SHA" ]]; then
            echo "::error::This migration run became stale before application."
            exit 1
          fi
      - name: Apply production migrations
        run: npm run db:migrate --workspace @drezivo/api
      - name: Verify production migration status
        run: npm run db:migrate:status --workspace @drezivo/api

  publish:
    name: publish versioned backend image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [container]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$CR_PAT" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and publish versioned image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}/api
          VERSION: ${{ github.ref_name }}
        run: |
          IMAGE="${IMAGE,,}"
          docker build \
            --file api/Dockerfile \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:${GITHUB_SHA}" \
            .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:${GITHUB_SHA}"
