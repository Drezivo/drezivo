name: monorepo-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm run typecheck --workspace @drezivo/contracts
      - run: npm run lint --workspace @drezivo/contracts
      - run: npm test --workspace @drezivo/contracts -- --run
      - run: npm run typecheck --workspace @drezivo/api
      - run: npm run lint --workspace @drezivo/api
      - run: npm test --workspace @drezivo/api -- --run
      - run: npm run typecheck --workspace @drezivo/app
      - run: npm run lint --workspace @drezivo/app
      - run: npm test --workspace @drezivo/app -- --run
      - run: npm run typecheck --workspace @drezivo/web
      - run: npm run lint --workspace @drezivo/web
      - run: npm test --workspace @drezivo/web -- --run
